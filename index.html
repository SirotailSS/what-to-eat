<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃点啥 - 自动配菜工具</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- 引入 qrcode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        
        <!-- 标题区 -->
        <header class="header">
            <h1>🍳 今天吃点啥</h1>
            <p class="subtitle">一键解决选择困难症</p>
        </header>

        <!-- 三卡展示区 -->
        <div class="cards-container">
            <!-- 卡片1：烹饪方式 -->
            <div class="card" id="cardCook">
                <div class="card-label">🔥 烹饪方式</div>
                <div class="card-content" id="cookDisplay">❓</div>
                <div class="card-tip" id="cookTip">点击下方按钮开始</div>
            </div>

            <!-- 卡片2：主料 -->
            <div class="card" id="cardMain">
                <div class="card-label">🥩 主料</div>
                <div class="card-content" id="mainDisplay">❓</div>
                <div class="card-tip">主要食材</div>
            </div>

            <!-- 卡片3：辅料 -->
            <div class="card" id="cardVeg">
                <div class="card-label">🌿 辅料</div>
                <div class="card-content" id="vegDisplay">❓</div>
                <div class="card-tip">搭配食材</div>
            </div>
        </div>

        <!-- 完整菜名展示 -->
        <div class="dish-name" id="dishName">
            👆 点击下方按钮生成菜品
        </div>

        <!-- 按钮区域 -->
        <div class="button-area">
            <button class="btn-generate" id="generateBtn">
                🎰 配菜！
            </button>
            <button class="btn-reset" id="resetBtn">
                🔄 重新摇一摇
            </button>
            <button class="btn-share" id="shareBtn">
                📤 分享今天的美食
            </button>
        </div>

        <!-- 二维码区域（页面布局的一部分） -->
        <div class="qr-section" id="qrSection">
            <div class="qr-placeholder" id="qrPlaceholder">
                <span class="qr-icon">📱</span>
                <span class="qr-text">分享后自动生成二维码</span>
            </div>
            <div class="qr-wrapper" id="qrWrapper" style="display: none;">
                <div id="qrcode"></div>
                <p class="qr-label">扫一扫，立即体验</p>
            </div>
        </div>

        <!-- ===== 新增：工具导航按钮区域 ===== -->
        <div class="nav-area">
            <button class="btn-tools" id="toolsBtn" onclick="window.location.href='#'">
                🧰 工具百宝箱
            </button>
            <button class="btn-coupon" id="couponBtn" onclick="window.location.href='#'">
                🧧 外卖领券
            </button>
        </div>

        
        <!-- 底部信息 -->
        <footer class="footer">
            <p class="subtitle">Copyright Sirotail @ 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
